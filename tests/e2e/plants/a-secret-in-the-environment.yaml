# expect: the run and the doors' addresses
{
  "apiVersion": "batch/v1",
  "kind": "Job",
  "metadata": {
    "name": "plant-a-secret-in-the-environment",
    "namespace": "triage-agents",
    "labels": {
      "app.kubernetes.io/name": "triage-agent",
      "triage.heyvaldemar.com/project": "kind01"
    }
  },
  "spec": {
    "backoffLimit": 0,
    "activeDeadlineSeconds": 300,
    "ttlSecondsAfterFinished": 3600,
    "template": {
      "metadata": {
        "labels": {
          "app.kubernetes.io/name": "triage-agent"
        }
      },
      "spec": {
        "serviceAccountName": "triage-agent",
        "automountServiceAccountToken": false,
        "restartPolicy": "Never",
        "dnsPolicy": "None",
        "dnsConfig": {
          "nameservers": [
            "10.96.0.53"
          ],
          "searches": [
            "triage-agents.svc.cluster.local",
            "svc.cluster.local",
            "cluster.local"
          ],
          "options": [
            {
              "name": "ndots",
              "value": "5"
            }
          ]
        },
        "securityContext": {
          "runAsNonRoot": true,
          "runAsUser": 10001,
          "runAsGroup": 10001,
          "seccompProfile": {
            "type": "RuntimeDefault"
          }
        },
        "initContainers": [
          {
            "name": "wait-for-the-wall",
            "image": "docker.io/library/busybox:1.37@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e",
            "command": [
              "sh",
              "-c",
              "for i in $(seq 1 60); do if nslookup -timeout=1 kubernetes.default.svc.cluster.local 10.96.0.53 >/dev/null 2>&1 && ! nslookup -timeout=1 example.com 10.96.0.10 >/dev/null 2>&1; then exit 0; fi; sleep 1; done; echo \"the network policy never took hold\"; exit 1"
            ],
            "resources": {
              "requests": {
                "cpu": "10m",
                "memory": "16Mi"
              },
              "limits": {
                "cpu": "100m",
                "memory": "32Mi"
              }
            },
            "securityContext": {
              "allowPrivilegeEscalation": false,
              "readOnlyRootFilesystem": true,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              }
            }
          }
        ],
        "containers": [
          {
            "name": "agent",
            "image": "docker.io/library/python:3.13-alpine@sha256:bf12ecc0bea3f171d55145dd02c78b5eeb09f30ee2ac9cc2b4c9e4e8f5e30741",
            "command": [
              "python3",
              "/agent/agent.py"
            ],
            "env": [
              {
                "name": "PYTHONDONTWRITEBYTECODE",
                "value": "1"
              },
              {
                "name": "CLOUD_MCP_URL",
                "value": "http://cloud-mcp.cloud-mcp.svc.cluster.local:8080/mcp"
              },
              {
                "name": "NOTIFY_URL",
                "value": "http://notifier.notify.svc.cluster.local:8080/notify"
              },
              {
                "name": "RUN_PROJECT",
                "value": "kind01"
              },
              {
                "name": "RUN_NUMBER",
                "value": "424242"
              },
              {
                "name": "RUN_NUMBER",
                "valueFrom": {
                  "secretKeyRef": {
                    "name": "slack-webhook",
                    "key": "url"
                  }
                }
              }
            ],
            "resources": {
              "requests": {
                "cpu": "50m",
                "memory": "64Mi"
              },
              "limits": {
                "cpu": "500m",
                "memory": "128Mi"
              }
            },
            "securityContext": {
              "allowPrivilegeEscalation": false,
              "readOnlyRootFilesystem": true,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              }
            },
            "volumeMounts": [
              {
                "name": "agent",
                "mountPath": "/agent",
                "readOnly": true
              },
              {
                "name": "cloud-mcp-token",
                "mountPath": "/var/run/secrets/cloud-mcp",
                "readOnly": true
              },
              {
                "name": "notify-token",
                "mountPath": "/var/run/secrets/notify",
                "readOnly": true
              }
            ]
          }
        ],
        "volumes": [
          {
            "name": "agent",
            "configMap": {
              "name": "triage-agent"
            }
          },
          {
            "name": "cloud-mcp-token",
            "projected": {
              "sources": [
                {
                  "serviceAccountToken": {
                    "audience": "cloud-mcp.triage.heyvaldemar.com",
                    "expirationSeconds": 600,
                    "path": "token"
                  }
                }
              ]
            }
          },
          {
            "name": "notify-token",
            "projected": {
              "sources": [
                {
                  "serviceAccountToken": {
                    "audience": "notify.triage.heyvaldemar.com",
                    "expirationSeconds": 600,
                    "path": "token"
                  }
                }
              ]
            }
          }
        ]
      }
    }
  }
}
