# The agents' own resolver: CoreDNS that answers for the cluster's names and
# nothing else. It has no forward block, so a name outside cluster.local gets
# no answer, and a lookup cannot carry data out the way a query relayed to
# the internet can. The cluster's own CoreDNS still forwards, for everyone
# else; the agents may not reach it (network-policies.yaml), and their pods
# name this resolver instead (dnsConfig in receiver/job.json; admission
# refuses a triage pod that names another).
#
# Its one outbound connection is to the API server, to watch Services and
# EndpointSlices; scripts/install.sh writes that rule, which names
# the API server's address.
apiVersion: v1
kind: Namespace
metadata:
  name: agent-dns
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-dns
  namespace: agent-dns
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-dns
rules:
  - apiGroups: [""]
    resources: [services, namespaces]
    verbs: [list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-dns
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agent-dns
subjects:
  - {kind: ServiceAccount, name: agent-dns, namespace: agent-dns}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-dns
  namespace: agent-dns
data:
  Corefile: |
    .:1053 {
        errors
        kubernetes cluster.local in-addr.arpa ip6.arpa {
            fallthrough in-addr.arpa ip6.arpa
        }
        cache 30
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-dns
  namespace: agent-dns
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: agent-dns}
  template:
    metadata:
      labels: {app.kubernetes.io/name: agent-dns}
    spec:
      serviceAccountName: agent-dns
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: coredns
          image: registry.k8s.io/coredns/coredns:v1.14.7@sha256:7efd3c635b03efd68c4e8398fc45f0d993d0e9ab016f72c1cefb0fd6d01aa286
          args: [-conf, /etc/coredns/Corefile]
          ports:
            - {name: dns, containerPort: 1053, protocol: UDP}
            - {name: dns-tcp, containerPort: 1053, protocol: TCP}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            # The image's /coredns carries the file capability
            # NET_BIND_SERVICE, and with every capability dropped the kernel
            # refuses to exec it ("operation not permitted"). Restricted Pod
            # Security allows adding this one back, and nothing else.
            capabilities: {drop: [ALL], add: [NET_BIND_SERVICE]}
          volumeMounts: [{name: config, mountPath: /etc/coredns, readOnly: true}]
          readinessProbe:
            tcpSocket: {port: 1053}
      volumes:
        - name: config
          configMap: {name: agent-dns}
---
# A fixed address, so an agent pod can name it in its dnsConfig before any
# lookup: inside kind's default Service range, 10.96.0.0/16.
apiVersion: v1
kind: Service
metadata:
  name: agent-dns
  namespace: agent-dns
spec:
  clusterIP: 10.96.0.53
  selector: {app.kubernetes.io/name: agent-dns}
  ports:
    - {name: dns, port: 53, targetPort: 1053, protocol: UDP}
    - {name: dns-tcp, port: 53, targetPort: 1053, protocol: TCP}
