# The webhook receiver (receiver.py says what it checks). It holds the
# signing secret, which scripts/install.sh generates, and its Kubernetes
# token can do one thing: create Jobs in triage-agents, where admission
# holds them to the template's shape.
#
# PROJECTS is the Cypress project IDs this door triages; kind01 is the one
# the e2e run records on kind.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: receiver
  namespace: triage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: start-triage
  namespace: triage-agents
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: receiver-starts-triage
  namespace: triage-agents
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: start-triage
subjects:
  - kind: ServiceAccount
    name: receiver
    namespace: triage
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: receiver
  namespace: triage
  labels:
    app.kubernetes.io/name: receiver
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: receiver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: receiver
    spec:
      serviceAccountName: receiver
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: receiver
          image: docker.io/library/python:3.13-alpine@sha256:bf12ecc0bea3f171d55145dd02c78b5eeb09f30ee2ac9cc2b4c9e4e8f5e30741
          command: [python3, /app/receiver.py]
          env:
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
            - {name: PROJECTS, value: kind01}
            - {name: JOB_TEMPLATE, value: /app/job.json}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          resources:
            requests: {cpu: 20m, memory: 48Mi}
            limits: {cpu: 500m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: app, mountPath: /app, readOnly: true}
            - {name: signing-secret, mountPath: /var/run/secrets/webhook, readOnly: true}
      volumes:
        - name: app
          configMap:
            name: receiver
        # Created by scripts/install.sh, never in Git.
        - name: signing-secret
          secret:
            secretName: webhook-signing
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: receiver
  namespace: triage
spec:
  selector:
    app.kubernetes.io/name: receiver
  ports:
    - {name: http, port: 8080, targetPort: http}
