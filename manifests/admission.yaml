# What may run in triage-agents, enforced by the API server itself: a
# ValidatingAdmissionPolicy is evaluated in-process, so no webhook,
# controller or add-on has to be running for it to refuse.
#
# The receiver is the only thing allowed to create Jobs there, and it fills a
# fixed template (receiver/job.json) with a project ID and a run number. This
# policy holds every Job and Pod in the namespace to that template's shape
# whatever the receiver sends, so a receiver that is tricked or replaced can
# start the triage agent on a run, and nothing else: no other image, script,
# credential, environment, resolver or lifetime.
#
# A second policy holds the three doors (receiver, Cloud MCP, notifier) to a
# pinned, read-only, limited shape, since each parses what a stranger or a
# fooled agent sends. Pod Security "restricted" is on every namespace
# underneath both.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: triage-agent
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [deployments, statefulsets, replicasets, daemonsets]
      - apiGroups: [batch]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [jobs, cronjobs]
  variables:
    - name: podSpec
      expression: >-
        object.kind == 'Pod' ? object.spec :
        object.kind == 'CronJob' ? object.spec.jobTemplate.spec.template.spec :
        object.spec.template.spec
    - name: inits
      expression: >-
        has(variables.podSpec.initContainers) ? variables.podSpec.initContainers : []
    - name: containers
      expression: variables.podSpec.containers + variables.inits
  validations:
    - expression: object.kind in ['Pod', 'Job']
      message: only Jobs run in triage-agents; the receiver starts one per failed run
    - expression: >-
        object.kind != 'Job' || (has(object.spec.backoffLimit) && object.spec.backoffLimit == 0 &&
        has(object.spec.activeDeadlineSeconds) && object.spec.activeDeadlineSeconds <= 600)
      message: a triage Job runs once (backoffLimit 0) and for ten minutes at most
    - expression: >-
        has(variables.podSpec.serviceAccountName) && variables.podSpec.serviceAccountName == 'triage-agent'
      message: a triage pod runs as the triage-agent ServiceAccount
    - expression: >-
        has(variables.podSpec.automountServiceAccountToken) &&
        variables.podSpec.automountServiceAccountToken == false
      message: a triage pod gets no Kubernetes API token; set automountServiceAccountToken to false
    # Two images, by digest: the agent's interpreter and the gate's shell.
    # scripts/validate.sh checks they are the ones receiver/job.json names.
    - expression: >-
        variables.podSpec.containers.all(c, c.image ==
        'docker.io/library/python:3.13-alpine@sha256:bf12ecc0bea3f171d55145dd02c78b5eeb09f30ee2ac9cc2b4c9e4e8f5e30741') &&
        variables.inits.all(c, c.image ==
        'docker.io/library/busybox:1.37@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e')
      message: a triage pod runs the pinned agent image, and the pinned gate image before it
    - expression: >-
        variables.podSpec.containers.all(c, has(c.command) && c.command == ['python3', '/agent/agent.py'] &&
        !has(c.args))
      message: a triage pod runs the triage agent's script, and nothing else
    - expression: >-
        variables.inits.all(c, !has(c.volumeMounts) || size(c.volumeMounts) == 0)
      message: the gate before the agent mounts nothing, so it holds no token
    - expression: >-
        variables.containers.all(c, has(c.resources) && has(c.resources.limits) &&
        'cpu' in c.resources.limits && 'memory' in c.resources.limits)
      message: every container declares CPU and memory limits
    - expression: >-
        variables.containers.all(c, has(c.securityContext) &&
        has(c.securityContext.readOnlyRootFilesystem) && c.securityContext.readOnlyRootFilesystem)
      message: every container runs with a read-only root filesystem
    # A credential an agent can read is a credential a fooled agent can send.
    # Its volumes are the agent's script and two door tokens, nothing else.
    - expression: >-
        !has(variables.podSpec.volumes) || variables.podSpec.volumes.all(v,
        (has(v.configMap) && v.configMap.name == 'triage-agent') ||
        (has(v.projected) && v.projected.sources.all(s, has(s.serviceAccountToken))))
      message: a triage pod mounts its script and its door tokens, and no Secret or other volume
    - expression: >-
        !has(variables.podSpec.volumes) || variables.podSpec.volumes.all(v,
        !has(v.projected) || v.projected.sources.all(s, !has(s.serviceAccountToken) ||
        (has(s.serviceAccountToken.audience) &&
        s.serviceAccountToken.audience in ['cloud-mcp.triage.heyvaldemar.com', 'notify.triage.heyvaldemar.com'] &&
        has(s.serviceAccountToken.expirationSeconds) && s.serviceAccountToken.expirationSeconds <= 3600)))
      message: a token in a triage pod is for one of its two doors and expires within an hour
    # The environment carries the run and the doors' addresses, as values.
    - expression: >-
        variables.containers.all(c, !has(c.envFrom) && (!has(c.env) || c.env.all(e,
        e.name in ['PYTHONDONTWRITEBYTECODE', 'CLOUD_MCP_URL', 'NOTIFY_URL', 'RUN_PROJECT', 'RUN_NUMBER'] &&
        !has(e.valueFrom))))
      message: a triage pod's environment is the run and the doors' addresses, as plain values
    - expression: >-
        variables.containers.all(c, !has(c.env) || c.env.all(e,
        (e.name != 'RUN_PROJECT' || (has(e.value) && e.value.matches('^[a-z0-9]{6}$'))) &&
        (e.name != 'RUN_NUMBER' || (has(e.value) && e.value.matches('^[1-9][0-9]{0,8}$')))))
      message: RUN_PROJECT is a Cypress project ID and RUN_NUMBER a run number
    # The agents' own resolver, which answers for cluster names only.
    - expression: >-
        has(variables.podSpec.dnsPolicy) && variables.podSpec.dnsPolicy == 'None' &&
        has(variables.podSpec.dnsConfig) && has(variables.podSpec.dnsConfig.nameservers) &&
        variables.podSpec.dnsConfig.nameservers == ['10.96.0.53']
      message: a triage pod asks the agents' resolver (10.96.0.53) and no other
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: triage-agent
spec:
  policyName: triage-agent
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        triage.heyvaldemar.com/agents: "true"
---
# The doors: what reaches them is untrusted input, so they run read-only, by
# digest, with limits. Unlike an agent, a door may hold a credential and a
# Kubernetes token: that is its job.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: triage-door
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [deployments, statefulsets, replicasets, daemonsets]
      - apiGroups: [batch]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [jobs, cronjobs]
  variables:
    - name: podSpec
      expression: >-
        object.kind == 'Pod' ? object.spec :
        object.kind == 'CronJob' ? object.spec.jobTemplate.spec.template.spec :
        object.spec.template.spec
    - name: containers
      expression: >-
        variables.podSpec.containers +
        (has(variables.podSpec.initContainers) ? variables.podSpec.initContainers : [])
  validations:
    - expression: >-
        variables.containers.all(c, c.image.contains('@sha256:'))
      message: every image is referenced by digest; a tag can point at different bytes tomorrow
    - expression: >-
        variables.containers.all(c, has(c.resources) && has(c.resources.limits) &&
        'cpu' in c.resources.limits && 'memory' in c.resources.limits)
      message: every container declares CPU and memory limits
    - expression: >-
        variables.containers.all(c, has(c.securityContext) &&
        has(c.securityContext.readOnlyRootFilesystem) && c.securityContext.readOnlyRootFilesystem)
      message: every container runs with a read-only root filesystem
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: triage-door
spec:
  policyName: triage-door
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        triage.heyvaldemar.com/door: "true"
