# What is outside the cluster, on kind (recorder.py): Slack's incoming
# webhook in `slack`, and an address an attacker owns in `outside`. Both
# print what reaches them; the e2e run reads those lines.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slack
  namespace: slack
  labels:
    app.kubernetes.io/name: slack
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: slack
  template:
    metadata:
      labels:
        app.kubernetes.io/name: slack
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: slack
          image: docker.io/library/python:3.13-alpine@sha256:bf12ecc0bea3f171d55145dd02c78b5eeb09f30ee2ac9cc2b4c9e4e8f5e30741
          command: [python3, /app/recorder.py]
          env:
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
            - {name: ROLE, value: slack}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: app, mountPath: /app, readOnly: true}
      volumes:
        - name: app
          configMap:
            name: recorder
---
apiVersion: v1
kind: Service
metadata:
  name: slack
  namespace: slack
spec:
  selector:
    app.kubernetes.io/name: slack
  ports:
    - {name: http, port: 8080, targetPort: http}
---
