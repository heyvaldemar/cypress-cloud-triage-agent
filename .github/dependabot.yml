# Keeps the pinned GitHub Actions current. Images (Cypress, Python, busybox,
# CoreDNS, the kind node) and CLI tools are pinned by digest or hash in files
# Dependabot does not read; they are moved by hand, with the new hash checked
# against the publisher's, and scripts/check-freshness.py reports which have
# fallen behind.
#
# Grouped: one pull request per week is a queue that gets read.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
