name: Live Cloud MCP

# The one workflow that reaches Cypress Cloud (ADR 8, proposed). It records
# the spec to the maintainer's project with --record and asks the real Cloud
# MCP what it serves about that run, so the door's forward to
# mcp.cypress.io is written from Cloud MCP's answers and not from a guess:
# the docs name the tools but publish neither their arguments nor their
# answers.
#
# The record key, the Cloud MCP token and the project ID are secrets of the
# environment cypress-cloud, which only main may use. The job's log and
# summary show the protocol, the tool schemas and each answer's shape with
# its values replaced by their types. The answers go only into an artifact
# encrypted to the certificate passed as `recipient`; without one, nothing
# but the public part is kept.
on:
  workflow_dispatch:
    inputs:
      recipient:
        description: PEM certificate to encrypt the answers to (optional)
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: live-cloud-mcp
  cancel-in-progress: false

jobs:
  probe:
    name: Record a run, read it back through Cloud MCP
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cypress-cloud
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record the spec to Cypress Cloud
        env:
          CYPRESS_PROJECT_ID: ${{ secrets.CYPRESS_PROJECT_ID }}
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
        run: ./scripts/live.sh record

      - name: Ask Cloud MCP about the run
        env:
          CYPRESS_PROJECT_ID: ${{ secrets.CYPRESS_PROJECT_ID }}
          TOKEN: ${{ secrets.CYPRESS_MCP_TOKEN }}
        run: python3 -I scripts/live-probe.py out/cypress-results.json out <<<"$TOKEN"

      - name: Encrypt the answers to the recipient, or drop them
        if: always()
        env:
          RECIPIENT: ${{ inputs.recipient }}
        run: |
          if [ -s out/probe.json ] && [ -n "$RECIPIENT" ]; then
            printf '%s\n' "$RECIPIENT" > "$RUNNER_TEMP/recipient.pem"
            openssl x509 -in "$RUNNER_TEMP/recipient.pem" -noout -fingerprint -sha256
            openssl cms -encrypt -binary -aes256 -outform DER -in out/probe.json \
              -out "$RUNNER_TEMP/probe.cms" "$RUNNER_TEMP/recipient.pem"
          fi
          rm -f out/probe.json

      - name: Keep the encrypted answers
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: probe-encrypted
          path: ${{ runner.temp }}/probe.cms
          if-no-files-found: ignore
          retention-days: 1
